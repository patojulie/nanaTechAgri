name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agri_db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Generate Prisma Client
      run: npm run prisma:generate
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/agri_db_test"

    - name: Run migrations
      run: npm run prisma:migrate:prod
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/agri_db_test"

    - name: Run tests
      run: npm run test:cov
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/agri_db_test"
        REDIS_URL: "redis://localhost:6379"
        JWT_SECRET: "test_secret_key"
        JWT_REFRESH_SECRET: "test_refresh_secret"

    - name: Build
      run: npm run build

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: always()
      with:
        files: ./coverage/coverage-final.json
        flags: unittests
        name: codecov-umbrella

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: secrets.DOCKER_USERNAME != ''

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      if: secrets.DOCKER_USERNAME != ''
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/agri-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/agri-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
